name: Maven Package

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build application with Maven
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: ./mvnw package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

  create-and-publish-docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: .

      - name: Log in to GitHub Container Registry
        run: docker login ghcr.io -u OHOKs -p ${{ github.token }}

      - name: Build Docker image
        run: docker build . -t ghcr.io/ohoks/cubix/1/homework/app:springboot

      - name: Publish Docker image
        run: docker push ghcr.io/ohoks/cubix/1/homework/app:springboot

  verify-docker:
    name: Verify Docker image
    runs-on: ubuntu-latest
    needs: create-and-publish-docker
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: docker login ghcr.io -u OHOKs -p ${{ github.token }}

      - name: Verify Docker image
        run: |
          chmod +x verify-image.sh
          ./verify-image.sh
